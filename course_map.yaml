# course_map.yaml -- single source of truth for module order, status and dependencies.
# Drives: (1) the printed course map (build_course_map.py -> course_map.tex/pdf)
#         (2) the site navigation (site/mkdocs.yml generated from this file by tools/build_site.py)
# Edit this file, not the generated outputs.
course:
  title: Elementary Linear Algebra
  term: Spring 2027
  textbook: "Lay, Linear Algebra and Its Applications (Pearson MyLab); Larson as secondary reference"
  length: "15 weeks, two 80-minute lectures per week (30 slots; ~26 usable after exams/review)"
  site_launch: 2027-01 (first week)
  pacing: deferred   # lecture slots are intentionally unassigned until the instructor decides
  dropped_on_purpose: ["1.6", "1.10", "2.4", "2.6", "2.7", "2.8", "2.9", "4.7", "4.8", "5.5-5.9", "6.6", "6.8"]
  # 2.8/2.9 are omitted because Ch. 4 covers the same ideas in general form (Lay's own footnote).

# status values: todo | in-progress | done | legacy  (legacy = delivered in Week 1, not yet converted to a module)
# tested: false  => full notes/site page are built, but the section is excluded from exams (homework optional).
# visibility: notes/worksheet/homework PDFs are public; instructor notes and solutions are private.
modules:
  - {id: "1.1", chapter: 1, title: "Systems of Linear Equations", tested: true, prereqs: [], status: done}
  - {id: "1.2", chapter: 1, title: "Row Reduction and Echelon Forms", tested: true, prereqs: ["1.1"], status: done}
  - {id: "1.3", chapter: 1, title: "Vector Equations", tested: true, prereqs: ["1.2"], status: done}
  - {id: "1.4", chapter: 1, title: "The Matrix Equation Ax = b", tested: true, prereqs: ["1.3"], status: done}
  - {id: "1.5", chapter: 1, title: "Solution Sets of Linear Systems", tested: true, prereqs: ["1.4"], status: todo}
  - {id: "1.7", chapter: 1, title: "Linear Independence", tested: true, prereqs: ["1.5"], status: todo}
  - {id: "1.8", chapter: 1, title: "Introduction to Linear Transformations", tested: true, prereqs: ["1.4", "1.7"], status: todo}
  - {id: "1.9", chapter: 1, title: "The Matrix of a Linear Transformation", tested: true, prereqs: ["1.8"], status: todo}
  - {id: "2.1", chapter: 2, title: "Matrix Operations", tested: true, prereqs: ["1.9"], status: todo}
  - {id: "2.2", chapter: 2, title: "The Inverse of a Matrix", tested: true, prereqs: ["2.1"], status: todo}
  - {id: "2.3", chapter: 2, title: "Characterizations of Invertible Matrices", tested: true, prereqs: ["2.2", "1.7", "1.9"], status: todo}
  - {id: "2.5", chapter: 2, title: "Matrix Factorizations", tested: false, prereqs: ["2.2"], status: todo, note: "Enrichment (LU). Not required by any later section."}
  - {id: "3.1", chapter: 3, title: "Introduction to Determinants", tested: true, prereqs: ["2.2"], status: todo}
  - {id: "3.2", chapter: 3, title: "Properties of Determinants", tested: true, prereqs: ["3.1"], status: todo, note: "Include a Pause-and-think on |det A| as an area/volume scale factor (replaces 3.3)."}
  - {id: "3.3", chapter: 3, title: "Cramer's Rule, Volume, and Linear Transformations", tested: false, prereqs: ["3.2"], status: todo, note: "Enrichment. Not required by any later section."}
  - {id: "4.1", chapter: 4, title: "Vector Spaces and Subspaces", tested: true, prereqs: ["2.3", "3.2"], status: todo, note: "Generalizes R^n; do not repeat Ch. 1-2 material, abstract it."}
  - {id: "4.2", chapter: 4, title: "Null Spaces, Column Spaces, Row Spaces, and Linear Transformations", tested: true, prereqs: ["4.1", "2.1"], status: todo}
  - {id: "4.3", chapter: 4, title: "Linearly Independent Sets; Bases", tested: true, prereqs: ["4.2", "1.7"], status: todo}
  - {id: "4.4", chapter: 4, title: "Coordinate Systems", tested: true, prereqs: ["4.3"], status: todo}
  - {id: "4.5", chapter: 4, title: "The Dimension of a Vector Space", tested: true, prereqs: ["4.4"], status: todo, note: "Includes the Rank Theorem and the IMT continuation."}
  - {id: "4.6", chapter: 4, title: "Change of Basis", tested: false, prereqs: ["4.4"], status: todo, note: "Enrichment. Section 5.4 must stand on 4.4 alone and introduce the change-of-basis matrix itself."}
  - {id: "5.1", chapter: 5, title: "Eigenvectors and Eigenvalues", tested: true, prereqs: ["4.1", "4.3"], status: todo}
  - {id: "5.2", chapter: 5, title: "The Characteristic Equation", tested: true, prereqs: ["5.1", "3.2"], status: todo}
  - {id: "5.3", chapter: 5, title: "Diagonalization", tested: true, prereqs: ["5.2", "4.3"], status: todo}
  - {id: "5.4", chapter: 5, title: "Eigenvectors and Linear Transformations", tested: true, prereqs: ["5.3", "4.4"], status: todo, note: "Diagonalization as choosing a better basis. Self-contained without 4.6."}
  - {id: "6.1", chapter: 6, title: "Inner Product, Length, and Orthogonality", tested: true, prereqs: ["4.2"], status: todo}
  - {id: "6.2", chapter: 6, title: "Orthogonal Sets", tested: true, prereqs: ["6.1", "4.3"], status: todo}
  - {id: "6.3", chapter: 6, title: "Orthogonal Projections", tested: true, prereqs: ["6.2", "4.4"], status: todo, note: "Needed by 6.4, 6.5 and 6.7."}
  - {id: "6.4", chapter: 6, title: "The Gram-Schmidt Process", tested: true, prereqs: ["6.3"], status: todo}
  - {id: "6.5", chapter: 6, title: "Least-Squares Problems", tested: true, prereqs: ["6.3", "6.4"], status: todo, note: "Payoff for the chapter; ties back to inconsistent systems in Ch. 1."}
  - {id: "6.7", chapter: 6, title: "Inner Product Spaces", tested: true, priority: if-time-permits, prereqs: ["6.3", "6.4", "4.1"], status: todo, note: "Abstraction payoff for Ch. 6. Build last; decide in April whether it makes the syllabus."}
